# =============================================================================
#  prism-extension-services.conf
#  Apache reverse-proxy configuration for PrismExtensionServices
# =============================================================================
#
#  HOW TO INCLUDE THIS FILE IN httpd.conf
#  ----------------------------------------
#  Copy this file into Apache's extra config folder, then add the following
#  line to httpd.conf anywhere after the main server configuration block
#  (after ServerName, DocumentRoot, etc.):
#
#      Include "C:/Apache24/conf/extra/prism-extension-services.conf"
#
#  Apache on Windows uses forward slashes in paths even though the OS uses
#  backslashes.  Adjust the path above to match your Apache installation.
#  Common locations:
#      C:/Apache24/conf/extra/          (Apache Lounge / standard Windows install)
#      C:/xampp/apache/conf/extra/      (XAMPP)
#
#  REQUIRED MODULES
#  ----------------
#  Ensure the following lines are present and uncommented in httpd.conf
#  (they are present but commented out in a default Windows Apache install):
#
#      LoadModule proxy_module        modules/mod_proxy.so
#      LoadModule proxy_http_module   modules/mod_proxy_http.so
#      LoadModule headers_module      modules/mod_headers.so
#
# =============================================================================


# ---------------------------------------------------------------------------
# ProxyPreserveHost On
#
# Forwards the original Host header (e.g. "myserver.local") to Kestrel
# instead of replacing it with "localhost:5000".  Required so that ASP.NET
# Core can correctly build absolute URLs (redirects, link generation).
# ---------------------------------------------------------------------------
ProxyPreserveHost On


# ---------------------------------------------------------------------------
# ProxyPass / ProxyPassReverse
#
# The /ppExtApi prefix is kept in the forwarded URL so that ASP.NET Core's
# app.UsePathBase("/ppExtApi") middleware can strip it and record it as the
# request's PathBase.  Both directives are needed:
#
#   ProxyPass        — tells Apache which incoming paths to forward and where.
#   ProxyPassReverse — rewrites Location/Content-Location response headers that
#                      Kestrel might return pointing to http://localhost:5000,
#                      translating them back to the public URL.
#
# Adjust the port (5000) to match ServicePort in PrismExtensionServices.json.
# ---------------------------------------------------------------------------
ProxyPass        /ppExtApi  http://localhost:5000/ppExtApi
ProxyPassReverse /ppExtApi  http://localhost:5000/ppExtApi


# ---------------------------------------------------------------------------
# X-Forwarded-Proto
#
# mod_proxy sets X-Forwarded-For (client IP) automatically.
# It does NOT set X-Forwarded-Proto, so we add it here.
#
# ASP.NET Core reads this header (via app.UseForwardedHeaders()) to determine
# whether the original request arrived over HTTP or HTTPS, which affects:
#   • HttpContext.Request.Scheme
#   • Secure-cookie generation
#   • HSTS and redirect behaviour
#
# If this VirtualHost is HTTPS-only, hard-code "https":
#     RequestHeader set X-Forwarded-Proto "https"
#
# If this VirtualHost may serve both HTTP and HTTPS, use the conditional form
# below so the header reflects the actual scheme of the client connection:
# ---------------------------------------------------------------------------
RequestHeader set X-Forwarded-Proto "https" env=HTTPS
RequestHeader set X-Forwarded-Proto "http"  env=!HTTPS
